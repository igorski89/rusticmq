name: CI
on: [push, pull_request]
jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - run: cargo test --locked --all-targets
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked
      - run: python3 -m pip install boto3
      - run: python3 integration/audit_checks.py
      - run: python3 integration/restart.py
      - name: AWS SDK integration
        run: |
          RUSTICMQ_BIND=127.0.0.1:19324 RUSTICMQ_BASE_URL=http://127.0.0.1:19324 target/debug/rusticmq &
          server_pid=$!
          trap 'kill -TERM "$server_pid"; wait "$server_pid"' EXIT
          RUSTICMQ_ENDPOINT=http://127.0.0.1:19324 python3 integration/aws_sdk.py
          RUSTICMQ_ENDPOINT=http://127.0.0.1:19324 python3 integration/query.py
  docker-backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
          key: upstream-sbt-${{ runner.os }}-${{ runner.arch }}-b2abbc62954851b5244211fba75c3ac83fb6e0b2
      - run: python -m pip install boto3
      - name: Prepare pinned upstream source and sbt launcher
        run: |
          mkdir -p target
          git init target/upstream-source
          git -C target/upstream-source fetch --depth 1 https://github.com/softwaremill/elasticmq.git b2abbc62954851b5244211fba75c3ac83fb6e0b2
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/scala-sbt/sbt-launch/2.0.10/sbt-launch-2.0.10.jar --output target/sbt-launch.jar
      - name: Full Linux Docker backend audit
        env:
          RUSTICMQ_SBT_LAUNCHER: target/sbt-launch.jar
        run: python integration/docker.py --source target/upstream-source --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-backend-${{ runner.arch }}
          path: |
            target/docker-audit
            target/upstream-audit/target/out/**/test-reports
            target/upstream-audit/rusticmq-server.log
