[package]
name = "rusticmq"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Rust port of ElasticMQ's SQS-compatible queue service"

[dependencies]
axum = "0.8"
base64 = "0.22"
bigdecimal = "0.4"
hocon = { version = "0.9", path = "vendor/hocon" }
rusqlite = { version = "0.38", features = ["bundled"] }
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

# jemalloc does not build with MSVC; Windows keeps the system allocator.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }

[features]
default = ["jemalloc"]
# Allocator for the rusticmq executable only. The library sets no global
# allocator, so embedding applications can disable default features.
jemalloc = ["dep:tikv-jemallocator"]

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

# The container carries only a static executable, so optimize it for speed and
# strip it separately from normal release builds.
[profile.container]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
