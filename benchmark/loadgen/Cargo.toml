[package]
name = "loadgen"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Raw SQS JSON load generator for benchmark/compare.py"
publish = false

# Kept out of the server's build and dependency graph.
[workspace]

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[profile.release]
lto = true
codegen-units = 1
